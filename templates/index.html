<!DOCTYPE html>
<html>
<head>
    <title>Azure AI Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(135deg,#1e3a8a,#2563eb);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card {
            background:white;
            padding:40px;
            border-radius:12px;
            width:400px;
            text-align:center;
        }

        button {
            background:#2563eb;
            color:white;
            padding:12px;
            border:none;
            width:100%;
            margin-top:20px;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>📊 Azure AI Dashboard</h2>

    <form action="/analyze" method="post" enctype="multipart/form-data">
        <p><b>Inventory File</b></p>
        <input type="file" name="inventory" required>

        <p><b>Incident File</b></p>
        <input type="file" name="incident" required>

        <button type="submit">Analyze</button>
    </form>
</div>

</body>
</html>
