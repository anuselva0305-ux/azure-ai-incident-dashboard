<!DOCTYPE html>
<html>
<head>
    <title>Azure AI Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            text-align: center;
        }
        .container {
            margin-top: 100px;
            background: white;
            padding: 40px;
            width: 400px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
        }
        input, button {
            margin: 10px;
            padding: 10px;
            width: 90%;
        }
        button {
            background: #0078D4;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>📊 Azure AI Dashboard</h2>

    <form action="/analyze" method="post" enctype="multipart/form-data">
        
        <label>Upload Inventory File</label><br>
        <input type="file" name="inventory" required><br>

        <label>Upload Incident File</label><br>
        <input type="file" name="incident" required><br>

        <button type="submit">Analyze</button>

    </form>
</div>

</body>
</html>
