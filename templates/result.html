<!DOCTYPE html>
<html>
<head>
    <title>Executive Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family:'Segoe UI'; background:#f4f6f9; margin:0; }

        .header {
            background:#1f2937;
            color:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
        }

        .container { padding:20px; }

        .cards {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
        }

        .charts {
            margin-top:20px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .chart-card {
            background:white;
            padding:20px;
            border-radius:10px;
            height:300px;
        }

        canvas {
            width:100% !important;
            height:220px !important;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>📊 Executive Dashboard</h2>
    <a href="/" style="color:white;">⬅ Back</a>
</div>

<div class="container">

<div class="cards">
    <div class="card">Inventory<br><b>{{ inventory_count }}</b></div>
    <div class="card">Incidents<br><b>{{ incident_count }}</b></div>
    <div class="card">Top OS Sub<br><b>{{ top_os_sub }}</b></div>
    <div class="card">Top OS Name<br><b>{{ top_os_name }}</b></div>
</div>

<div class="charts">

<div class="chart-card"><h3>Priority</h3><canvas id="priorityChart"></canvas></div>
<div class="chart-card"><h3>Top Hosts</h3><canvas id="hostChart"></canvas></div>
<div class="chart-card"><h3>Resolution %</h3><canvas id="resolutionChart"></canvas></div>
<div class="chart-card"><h3>OS Type %</h3><canvas id="osChart"></canvas></div>

</div>

</div>

<script>
function draw(id,type,data){
    if(!data || Object.keys(data).length===0) return;

    new Chart(document.getElementById(id),{
        type:type,
        data:{
            labels:Object.keys(data),
            datasets:[{ data:Object.values(data) }]
        },
        options:{ responsive:true, maintainAspectRatio:false }
    });
}

draw("priorityChart","bar",{{ priority_counts | tojson }});
draw("hostChart","bar",{{ top_hosts | tojson }});
draw("resolutionChart","pie",{{ resolution_percent | tojson }});
draw("osChart","doughnut",{{ os_percent | tojson }});
</script>

</body>
</html>
