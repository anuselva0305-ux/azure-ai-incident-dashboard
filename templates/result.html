<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Result</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial; background: #f5f7fa; padding: 20px; }
        .top { display: flex; justify-content: space-between; }
        .card { background: white; padding: 15px; margin: 10px; border-radius: 8px; box-shadow: 0 0 5px #ccc; }
        canvas { margin: 20px 0; }
        a { text-decoration: none; color: #0078D4; }
    </style>
</head>
<body>

<div class="top">
    <h2>📊 Dashboard Result</h2>
    <a href="/">⬅ Back</a>
</div>

<div class="card">
    <h3>Inventory Count: {{ inventory_count }}</h3>
    <h3>Incident Count: {{ incident_count }}</h3>
    <h3>Top OS Subcategory: {{ top_os_sub }}</h3>
    <h3>Top OS Name: {{ top_os_name }}</h3>
</div>

<!-- CHARTS -->
<div class="card">
    <h3>Priority Distribution</h3>
    <canvas id="priorityChart"></canvas>
</div>

<div class="card">
    <h3>Top Hosts</h3>
    <canvas id="hostChart"></canvas>
</div>

<div class="card">
    <h3>Resolution %</h3>
    <canvas id="resolutionChart"></canvas>
</div>

<div class="card">
    <h3>OS Type %</h3>
    <canvas id="osChart"></canvas>
</div>

<div class="card">
    <h3>Top Categories</h3>
    <canvas id="categoryChart"></canvas>
</div>

<script>
const priorityData = {{ priority_counts | tojson }};
const hostData = {{ top_hosts | tojson }};
const resolutionData = {{ resolution_percent | tojson }};
const osData = {{ os_percent | tojson }};
const categoryData = {{ top_categories | tojson }};

// Priority Chart
new Chart(document.getElementById('priorityChart'), {
    type: 'bar',
    data: {
        labels: Object.keys(priorityData),
        datasets: [{ label: 'Priority', data: Object.values(priorityData) }]
    }
});

// Hosts
new Chart(document.getElementById('hostChart'), {
    type: 'bar',
    data: {
        labels: Object.keys(hostData),
        datasets: [{ label: 'Hosts', data: Object.values(hostData) }]
    }
});

// Resolution
new Chart(document.getElementById('resolutionChart'), {
    type: 'pie',
    data: {
        labels: Object.keys(resolutionData),
        datasets: [{ data: Object.values(resolutionData) }]
    }
});

// OS Type
new Chart(document.getElementById('osChart'), {
    type: 'pie',
    data: {
        labels: Object.keys(osData),
        datasets: [{ data: Object.values(osData) }]
    }
});

// Categories
new Chart(document.getElementById('categoryChart'), {
    type: 'bar',
    data: {
        labels: Object.keys(categoryData),
        datasets: [{ label: 'Categories', data: Object.values(categoryData) }]
    }
});
</script>

</body>
</html>
