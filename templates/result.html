<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Result</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        canvas {
            max-width: 500px;
            margin: auto;
        }
        .back {
            margin: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: #0078D4;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<a href="/" class="back">⬅ Back</a>

<div class="card">
    <h2>Summary</h2>
    <p>Inventory Count: {{ inventory_count }}</p>
    <p>Incident Count: {{ incident_count }}</p>
    <p>Top OS Subcategory: {{ top_os_sub }}</p>
    <p>Top OS Name: {{ top_os_name }}</p>
</div>

<div class="card">
    <h3>Priority Distribution</h3>
    <canvas id="priorityChart"></canvas>
</div>

<div class="card">
    <h3>Top 10 Hosts</h3>
    <canvas id="hostChart"></canvas>
</div>

<div class="card">
    <h3>Resolution %</h3>
    <canvas id="resolutionChart"></canvas>
</div>

<div class="card">
    <h3>OS Type %</h3>
    <canvas id="osChart"></canvas>
</div>

<div class="card">
    <h3>Top Categories</h3>
    <canvas id="categoryChart"></canvas>
</div>

<script>
const priorityData = {{ priority_counts | default({}) | tojson }};
const hostData = {{ top_hosts | default({}) | tojson }};
const resolutionData = {{ resolution_percent | default({}) | tojson }};
const osData = {{ os_percent | default({}) | tojson }};
const categoryData = {{ top_categories | default({}) | tojson }};

function createChart(id, type, dataObj) {
    if (Object.keys(dataObj).length === 0) return;

    new Chart(document.getElementById(id), {
        type: type,
        data: {
            labels: Object.keys(dataObj),
            datasets: [{
                data: Object.values(dataObj)
            }]
        }
    });
}

createChart("priorityChart", "bar", priorityData);
createChart("hostChart", "bar", hostData);
createChart("resolutionChart", "pie", resolutionData);
createChart("osChart", "pie", osData);
createChart("categoryChart", "bar", categoryData);

</script>

</body>
</html>
