<!DOCTYPE html>
<html>
<head>
    <title>Executive Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family:'Segoe UI';
            background:#f4f6f9;
            margin:0;
        }

        .header {
            background:#1f2937;
            color:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .container { padding:20px; }

        .cards {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
        }

        .charts {
            margin-top:20px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .chart-card {
            background:white;
            padding:20px;
            border-radius:10px;
            height:320px;
            display:flex;
            flex-direction:column;
        }

        .chart-card canvas {
            flex:1;
            max-height:250px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>📊 Executive Dashboard</h2>
    <a href="/" style="color:white;">⬅ Back</a>
</div>

<div class="container">

<div class="cards">
    <div class="card">Inventory<br><b>{{ inventory_count }}</b></div>
    <div class="card">Incidents<br><b>{{ incident_count }}</b></div>
    <div class="card">Top OS Sub<br><b>{{ top_os_sub }}</b></div>
    <div class="card">Top OS Name<br><b>{{ top_os_name }}</b></div>
</div>

<div class="charts">

<div class="chart-card">
<h3>Priority</h3>
<canvas id="priorityChart"></canvas>
</div>

<div class="chart-card">
<h3>Top Hosts</h3>
<canvas id="hostChart"></canvas>
</div>

<div class="chart-card">
<h3>Resolution %</h3>
<canvas id="resolutionChart"></canvas>
</div>

<div class="chart-card">
<h3>OS Type %</h3>
<canvas id="osChart"></canvas>
</div>

</div>

</div>

<script>
const priorityData = {{ priority_counts | tojson }};
const hostData = {{ top_hosts | tojson }};
const resolutionData = {{ resolution_percent | tojson }};
const osData = {{ os_percent | tojson }};

const colors = [
    '#3b82f6','#10b981','#f59e0b','#ef4444','#6366f1',
    '#14b8a6','#e11d48','#a855f7','#22c55e','#f97316'
];

function drawChart(id, type, data) {
    if (!data || Object.keys(data).length === 0) {
        console.log(id + " empty");
        return;
    }

    new Chart(document.getElementById(id), {
        type: type,
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data),
                backgroundColor: colors
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top' }
            }
        }
    });
}

drawChart("priorityChart","bar",priorityData);
drawChart("hostChart","bar",hostData);
drawChart("resolutionChart","pie",resolutionData);
drawChart("osChart","doughnut",osData);
</script>

</body>
</html>
