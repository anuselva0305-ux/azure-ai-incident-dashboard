<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }
        .header {
            background: #0078D4;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .tabs {
            text-align: center;
            margin: 20px;
        }
        .tabs button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .card {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 10px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        #charts {
            display: none;
            width: 60%;
            margin: auto;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🚀 Azure AI Dashboard</h1>
</div>

<div class="tabs">
    <button onclick="showTab('summary')">Summary</button>
    <button onclick="showTab('charts')">Charts</button>
</div>

<!-- SUMMARY -->
<div id="summary" style="text-align:center;">
    <div class="card">
        <h3>Inventory</h3>
        <h2>{{ inventory_count }}</h2>
    </div>

    <div class="card">
        <h3>Incidents</h3>
        <h2>{{ incident_count }}</h2>
    </div>

    <div class="card">
        <h3>Top OS Sub</h3>
        <h4>{{ top_os_sub }}</h4>
    </div>

    <div class="card">
        <h3>Top OS Name</h3>
        <h4>{{ top_os_name }}</h4>
    </div>
</div>

<!-- CHART -->
<div id="charts">
    <canvas id="priorityChart"></canvas>
</div>

<script>
function showTab(tab) {
    document.getElementById("summary").style.display = "none";
    document.getElementById("charts").style.display = "none";
    document.getElementById(tab).style.display = "block";
}

// Chart
const data = {{ priority_counts | tojson }};
const labels = Object.keys(data);
const values = Object.values(data);

new Chart(document.getElementById("priorityChart"), {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Ticket Priority",
            data: values
        }]
    }
});
</script>

</body>
</html>
